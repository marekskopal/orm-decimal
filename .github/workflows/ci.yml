name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  phpstan:
    name: PHPStan (orm ${{ matrix.orm }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        orm: ['^1.0', '^2.0']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: decimal

      - uses: ramsey/composer-install@v3

      - name: Install marekskopal/orm ${{ matrix.orm }}
        run: composer update marekskopal/orm --with "marekskopal/orm:${{ matrix.orm }}" --with-all-dependencies --no-interaction

      - run: vendor/bin/phpstan analyse

  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: decimal

      - uses: ramsey/composer-install@v3

      - run: vendor/bin/phpcs

  phpunit:
    name: PHPUnit (orm ${{ matrix.orm }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        orm: ['^1.0', '^2.0']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: decimal

      - uses: ramsey/composer-install@v3

      - name: Install marekskopal/orm ${{ matrix.orm }}
        run: composer update marekskopal/orm --with "marekskopal/orm:${{ matrix.orm }}" --with-all-dependencies --no-interaction

      - run: composer show marekskopal/orm | grep versions

      - run: vendor/bin/phpunit
